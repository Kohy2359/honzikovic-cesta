<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>352 D-obcí — Generátor obcí</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --solar:   #F5C518;
      --meadow:  #2A9D8F;
      --fuchsia: #EE3C95;
      --sage:    #A8C4BC;
      --cream:   #EDE8DC;
      --night:   #264040;
      --dust:    #8A9E9B;
      --earth:   #6B5B4F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--night);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%; left: -20%;
      width: 140%; height: 160%;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(245,197,24,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(42,157,143,0.07) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(238,60,149,0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    .box-title {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--solar);
      border: 1px solid rgba(245,197,24,.3);
      padding: .3rem 1rem;
      border-radius: 100px;
      margin-bottom: .85rem;
    }

    /* WORD BOX */
    .word-box {
      width: 100%;
      height: 370px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(245,197,24,.2);
      border-radius: 24px;
      padding: 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      transition: border-color .3s;
      position: relative;
      overflow: hidden;
    }

    .word-box::after {
      content: 'D';
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10rem;
      color: rgba(245,197,24,.04);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .word-box:hover {
      border-color: rgba(245,197,24,.5);
    }

    .word {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 9vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: .5rem;
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
    }

    .word .first-letter {
      color: var(--solar);
    }

    .meta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15rem;
      width: 100%;
    }

    .obyvatel {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1;
      letter-spacing: 2px;
      color: var(--solar);
    }

    .obyvatel-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(.9rem, 2.5vw, 1.1rem);
      color: var(--dust);
      margin-top: -.1rem;
      margin-bottom: .35rem;
    }

    .kraj {
      display: inline-block;
      background: rgba(42,157,143,.15);
      color: var(--meadow);
      border-radius: 100px;
      padding: .3rem 1.1rem;
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .5px;
    }

    /* BUTTON */
    button {
      background: var(--solar);
      color: var(--night);
      border: none;
      padding: .6rem 2rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border-radius: 100px;
      cursor: pointer;
      transition: all .2s;
      margin-top: .5rem;
    }

    button:hover {
      background: #ffd84a;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245,197,24,.3);
    }

    button:active {
      transform: translateY(0);
    }

    /* ANIMATION */
    @keyframes slideUp {
      0%  { opacity: 0; transform: translateY(16px); }
      100%{ opacity: 1; transform: translateY(0); }
    }

    .animate {
      animation: slideUp .35s cubic-bezier(.22,.68,0,1.2) forwards;
    }

    /* STATS */
    .stats {
      margin-top: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
    }

    .stats-bar-wrap {
      width: 120px;
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 100px;
      overflow: hidden;
    }

    .stats-bar {
      height: 100%;
      background: var(--solar);
      border-radius: 100px;
      transition: width .4s ease;
    }

    .stats-label {
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--dust);
      white-space: nowrap;
    }

    .stats-label strong {
      color: var(--solar);
    }

    @media (max-width: 480px) {
      .word-box { padding: 2rem 1.5rem; min-height: 170px; }
    }
  </style>
</head>

    const videne = new Set(JSON.parse(localStorage.getItem('videneObce') || '[]'));
    let fronta = [];

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextIndex() {
      if (!fronta.length) fronta = shuffle([...Array(obce.length).keys()]);
      return fronta.pop();
    }

    function formatPocet(n) {
      return n.toLocaleString('cs-CZ');
    }

    function updateStats() {
      const count = videne.size;
      const pct   = (count / obce.length) * 100;
      document.getElementById('statsCount').textContent = count;
      document.getElementById('statsBar').style.width   = pct + '%';
    }

    generate();

    function generate() {
      if (!obce.length) return;

      const index = nextIndex();
      const item = obce[index];

      const wordEl     = document.getElementById('word');
      const obyvatelEl = document.getElementById('obyvatel');
      const krajEl     = document.getElementById('kraj');

      wordEl.classList.remove('animate');
      obyvatelEl.classList.remove('animate');
      void wordEl.offsetWidth;

      const prvni  = item.obec[0];
      const zbytek = item.obec.slice(1);
      wordEl.innerHTML = `<span class="first-letter">${prvni}</span>${zbytek}`;

      obyvatelEl.textContent = formatPocet(item.obyvatel);
      krajEl.textContent     = item.kraj;

      wordEl.classList.add('animate');
      obyvatelEl.classList.add('animate');

      videne.add(index);
      localStorage.setItem('videneObce', JSON.stringify([...videne]));
      updateStats();
    }
