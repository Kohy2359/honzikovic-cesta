<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>352 D-obcí — Generátor slov</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --solar:   #F5C518;
      --meadow:  #2A9D8F;
      --fuchsia: #EE3C95;
      --sage:    #A8C4BC;
      --cream:   #EDE8DC;
      --night:   #264040;
      --dust:    #8A9E9B;
      --earth:   #6B5B4F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--night);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%; left: -20%;
      width: 140%; height: 160%;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(245,197,24,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(42,157,143,0.07) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(238,60,149,0.05) 0%, transparent 40%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    /* BADGE */
    .badge {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--solar);
      border: 1px solid rgba(245,197,24,.3);
      padding: .4rem 1.4rem;
      border-radius: 100px;
      margin-bottom: 1rem;
    }

    /* TITLE */
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 5.5rem);
      line-height: .92;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: .5rem;
    }

    h1 .accent { color: var(--solar); }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--sage);
      margin-bottom: 2.5rem;
    }

    .box-title {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--solar);
      border: 1px solid rgba(245,197,24,.3);
      padding: .3rem 1rem;
      border-radius: 100px;
      margin-bottom: .85rem;
    }

    /* WORD BOX */
    .word-box {
      width: 100%;
      min-height: 340px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(245,197,24,.2);
      border-radius: 24px;
      padding: 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: border-color .3s;
      position: relative;
      overflow: hidden;
    }

    .word-box::after {
      content: 'D';
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 10rem;
      color: rgba(245,197,24,.04);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .word-box:hover {
      border-color: rgba(245,197,24,.5);
    }

    .word {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 9vw, 4rem);
      line-height: 1;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: .5rem;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .word .first-letter {
      color: var(--solar);
    }

    .definition {
      font-family: 'Caveat', cursive;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--sage);
      line-height: 1.4;
      max-width: 420px;
      margin-bottom: .5rem;
    }

    .category {
      display: inline-block;
      background: rgba(245,197,24,.12);
      color: var(--solar);
      border-radius: 100px;
      padding: .25rem 1rem;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tema {
      display: inline-block;
      background: rgba(42,157,143,.15);
      color: var(--meadow);
      border-radius: 100px;
      padding: .25rem 1rem;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-left: .4rem;
    }

    .tema.hidden { display: none; }

    /* BUTTON */
    .btn-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    button {
      background: var(--solar);
      color: var(--night);
      border: none;
      padding: .6rem 2rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border-radius: 100px;
      cursor: pointer;
      transition: all .2s;
      margin-top: .5rem;
    }

    button:hover {
      background: #ffd84a;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245,197,24,.3);
    }

    button:active {
      transform: translateY(0);
    }

    /* FOOTER BADGE */
    .footer-brand {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      opacity: .35;
      transition: opacity .3s;
    }

    .footer-brand:hover { opacity: .6; }

    .footer-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--solar); }
    .footer-brand .dot.meadow { background: var(--meadow); }
    .footer-brand .dot.fuchsia { background: var(--fuchsia); }

    .footer-brand span {
      font-size: .6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
    }

    /* ANIMATION */
    @keyframes slideUp {
      0%  { opacity: 0; transform: translateY(16px); }
      100%{ opacity: 1; transform: translateY(0); }
    }

    .animate {
      animation: slideUp .35s cubic-bezier(.22,.68,0,1.2) forwards;
    }

    @media (max-width: 480px) {
      .word-box { padding: 2rem 1.5rem; min-height: 170px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="word-box">
      <div class="box-title">Generátor D-slov</div>
      <div class="word" id="word"><span class="first-letter">D</span>omov</div>
      <div class="definition" id="definition">Místo, kde člověk žije a cítí se bezpečně.</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-bottom:.25rem">
        <span class="category" id="category">podstatné jméno</span>
        <span class="tema hidden" id="tema"></span>
      </div>
      <button onclick="generate()">DALŠÍ SLOVO</button>
    </div>


  </div>

Otevřený prostor mezi zdmi; kde děti hrají a sousedé povídají.","kategorie":"podstatné jméno","tema":"obecné"}];
    let posledniIndex = -1;
    generate();

    function generate() {
      if (!slova.length) return;

      let index;
      do {
        index = Math.floor(Math.random() * slova.length);
      } while (index === posledniIndex && slova.length > 1);
      posledniIndex = index;

      const item = slova[index];

      const wordEl = document.getElementById('word');
      const defEl  = document.getElementById('definition');
      const catEl  = document.getElementById('category');
      const temaEl = document.getElementById('tema');

      wordEl.classList.remove('animate');
      defEl.classList.remove('animate');
      void wordEl.offsetWidth;

      const prvni = item.slovo[0];
      const zbytek = item.slovo.slice(1);
      wordEl.innerHTML = `<span class="first-letter">${prvni}</span>${zbytek}`;
      defEl.textContent = item.definice;
      catEl.textContent = item.kategorie;

      if (item.tema && item.tema !== 'obecné') {
        temaEl.textContent = item.tema;
        temaEl.classList.remove('hidden');
      } else {
        temaEl.classList.add('hidden');
      }

      wordEl.classList.add('animate');
      defEl.classList.add('animate');
    }
